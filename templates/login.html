<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinGuard - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6fb; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-card { background: #ffffff; border-radius: 20px; padding: 40px 32px; width: 100%; max-width: 380px; box-shadow: 0 15px 35px rgba(30,46,96,0.08); }
        .login-title { font-size: 26px; font-weight: 700; color: #1e2e60; margin-bottom: 6px; }
        .login-sub { font-size: 14px; color: #64748b; margin-bottom: 28px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 11px; font-weight: 700; color: #1e2e60; margin-bottom: 8px; text-transform: uppercase; }
        input[type="text"], input[type="password"] { width: 100%; padding: 14px; background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 14px; outline: none; color: #1e2e60; }
        .btn-primary { width: 100%; padding: 14px; background: #1e2e60; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="login-card">
    <h2 class="login-title">Login</h2>
    <p class="login-sub">Access your FinGuard account</p>

    <form onsubmit="handleLogin(event)">
        <div class="form-group">
            <label>USERNAME</label>
            <input type="text" placeholder="Enter username" required />
        </div>
        <div class="form-group">
            <label>PASSWORD</label>
            <input type="password" placeholder="Enter password" required />
        </div>
        <button type="submit" class="btn-primary">Login</button>
    </form>
</div>

<script>
function handleLogin(event) {
    event.preventDefault();
    // Redirect to Link Bank Account page after successful login
    window.location.href = '/link-account';
}
</script>

</body>
</html>
