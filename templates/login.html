<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinGuard - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: #ffffff; border-radius: 20px; padding: 32px; width: 100%; max-width: 400px; box-shadow: 0 15px 35px rgba(30,46,96,0.08); text-align: center; }
        .logo { font-size: 26px; font-weight: 800; color: #1e2e60; margin-bottom: 4px; }
        .sub { font-size: 13px; color: #64748b; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; text-align: left; }
        label { display: block; font-size: 11px; font-weight: 700; color: #1e2e60; margin-bottom: 6px; text-transform: uppercase; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 14px; outline: none; background: #fff; }
        .btn { width: 100%; padding: 14px; background: #1e2e60; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
        .error-banner { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; font-size: 12px; font-weight: 600; padding: 10px; border-radius: 8px; margin-bottom: 16px; display: none; text-align: left; }
        .link-text { font-size: 13px; color: #64748b; margin-top: 18px; }
        .link-text a { color: #2563eb; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">FinGuard</div>
    <p class="sub">Sign in to manage your aggregated accounts</p>

    <div class="error-banner" id="errorBanner"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label>Username or Email ID</label>
            <input type="text" id="loginIdentifier" placeholder="Enter username or email" required />
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter password" required />
        </div>

        <button type="submit" class="btn">Sign In</button>
    </form>

    <div class="link-text">
        Don't have an account? <a href="/register">Register here</a>
    </div>
</div>

<script>
function handleLogin(event) {
    event.preventDefault();
    const identifier = document.getElementById('loginIdentifier').value.trim().toLowerCase();
    const password = document.getElementById('loginPassword').value;
    const errorBanner = document.getElementById('errorBanner');

    const users = JSON.parse(localStorage.getItem('registeredUsers')) || [];

    // Find matching registered user by username or email
    const userFound = users.find(u => 
        (u.username.toLowerCase() === identifier || u.email.toLowerCase() === identifier)
    );

    if (!userFound) {
        errorBanner.innerText = "⚠️ Account not found. No user registered with this Username or Email ID.";
        errorBanner.style.display = 'block';
        return;
    }

    if (userFound.password !== password) {
        errorBanner.innerText = "⚠️ Incorrect password. Please try again.";
        errorBanner.style.display = 'block';
        return;
    }

    errorBanner.style.display = 'none';
    localStorage.setItem('currentUser', JSON.stringify(userFound));
    
    // Redirects to Biometric Verification page after successful credentials validation
    window.location.href = '/biometric';
}
</script>

</body>
</html>
