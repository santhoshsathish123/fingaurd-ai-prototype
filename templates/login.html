<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FinGuard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .neu-bg { background-color: #e6ecf0; }
    .neu-card { background: #e6ecf0; box-shadow: 20px 20px 60px #c4c9ce, -20px -20px 60px #ffffff; }
    .neu-input { background: #e6ecf0; box-shadow: inset 4px 4px 8px #c4c9ce, inset -4px -4px 8px #ffffff; }
    .neu-btn { background: #e6ecf0; box-shadow: 6px 6px 12px #c4c9ce, -6px -6px 12px #ffffff; }
    .neu-btn-blue { background: linear-gradient(145deg, #3b82f6, #2563eb); box-shadow: 6px 6px 14px #b8c2cc, -6px -6px 14px #ffffff; }
  </style>
</head>
<body class="neu-bg min-h-screen flex items-center justify-center p-4 font-sans text-slate-700">

  <div class="neu-card w-full max-w-sm p-8 rounded-[40px] relative overflow-hidden">
    
    <div class="text-center space-y-2 mb-6">
      <div class="w-16 h-16 neu-btn rounded-2xl flex items-center justify-center mx-auto text-2xl">
        🔒
      </div>
      <h1 class="text-2xl font-black text-slate-800 tracking-tight">Welcome</h1>
      <p class="text-xs text-slate-400 font-semibold">Login to continue your journey</p>
    </div>

    <!-- Submit form directly to Flask /login route -->
    <form action="/login" method="POST" class="space-y-4">
      <div>
        <label class="block text-[11px] font-bold text-slate-500 mb-1.5 ml-1">Email Address</label>
        <input type="email" name="email" required placeholder="name@example.com" class="w-full neu-input rounded-2xl py-3.5 px-4 text-xs font-semibold text-slate-700 outline-none focus:ring-2 focus:ring-blue-400">
      </div>

      <div>
        <label class="block text-[11px] font-bold text-slate-500 mb-1.5 ml-1">Password</label>
        <input type="password" name="password" required placeholder="••••••••" class="w-full neu-input rounded-2xl py-3.5 px-4 text-xs font-semibold text-slate-700 outline-none focus:ring-2 focus:ring-blue-400">
      </div>

      <div class="flex items-center justify-between text-[11px] font-bold text-slate-500 px-1 pt-1">
        <label class="flex items-center space-x-2 cursor-pointer">
          <input type="checkbox" class="rounded text-blue-600 focus:ring-0">
          <span>Remember me</span>
        </label>
        <a href="#" class="text-blue-600 hover:underline">Forgot Password?</a>
      </div>

      <button type="submit" class="w-full neu-btn-blue text-white font-bold py-3.5 rounded-2xl text-xs tracking-wider transition-all active:scale-[0.98] mt-2">
        LOGIN
      </button>
    </form>

    <div class="pt-6 border-t border-slate-300/50 mt-6 flex justify-center space-x-4">
      <button type="button" class="w-9 h-9 neu-btn rounded-full text-xs font-bold text-slate-600 flex items-center justify-center">G</button>
      <button type="button" class="w-9 h-9 neu-btn rounded-full text-xs font-bold text-slate-600 flex items-center justify-center">f</button>
      <button type="button" class="w-9 h-9 neu-btn rounded-full text-xs font-bold text-slate-600 flex items-center justify-center">in</button>
    </div>

  </div>

</body>
</html>
