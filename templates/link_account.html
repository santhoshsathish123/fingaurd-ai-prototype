<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinGuard - Link Bank Account</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6fb; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: #ffffff; border-radius: 20px; padding: 32px; width: 100%; max-width: 400px; box-shadow: 0 15px 35px rgba(30,46,96,0.08); text-align: center; }
        .title { font-size: 22px; font-weight: 700; color: #1e2e60; margin-bottom: 8px; }
        .sub { font-size: 13px; color: #64748b; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 11px; font-weight: 700; color: #1e2e60; margin-bottom: 8px; text-transform: uppercase; }
        input { width: 100%; padding: 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 15px; outline: none; }
        .btn { width: 100%; padding: 14px; background: #1e2e60; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        
        /* Modal Popup for OTP */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: #fff; padding: 28px; border-radius: 16px; width: 90%; max-width: 340px; text-align: center; }
        .otp-hint { font-size: 12px; color: #2563eb; background: #eff6ff; padding: 8px; border-radius: 6px; margin: 12px 0; font-weight: 600; }
        .error-msg { color: #dc2626; font-size: 12px; margin-top: 8px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2 class="title">Link Your Bank</h2>
    <p class="sub">Enter your registered mobile number to fetch accounts</p>

    <div class="form-group">
        <label>Mobile Number</label>
        <input type="text" id="phone" placeholder="e.g. 9876543210" maxlength="10" />
    </div>
    <button class="btn" onclick="sendOTP()">Send Verification Code</button>
</div>

<!-- OTP Modal Popup -->
<div class="modal" id="otpModal">
    <div class="modal-content">
        <h3 style="color: #1e2e60;">Enter Verification Code</h3>
        <p class="sub" style="margin-bottom: 6px;">We sent a code to your mobile</p>
        
        <!-- Demo Hint showing the hardcoded OTP -->
        <div class="otp-hint">Demo OTP: <b>1899</b></div>

        <div class="form-group">
            <input type="text" id="otpInput" placeholder="Enter 4-digit OTP" maxlength="4" style="text-align: center; font-size: 20px; letter-spacing: 4px;" />
            <div class="error-msg" id="errorMsg">Invalid OTP! Try 1899</div>
        </div>

        <button class="btn" onclick="verifyOTP()">Verify & Connect</button>
    </div>
</div>

<script>
function sendOTP() {
    const phone = document.getElementById('phone').value;
    if (phone.length < 10) {
        alert('Please enter a valid 10-digit mobile number');
        return;
    }
    // Show OTP modal
    document.getElementById('otpModal').style.display = 'flex';
}

function verifyOTP() {
    const userOTP = document.getElementById('otpInput').value;
    const errorMsg = document.getElementById('errorMsg');

    // Check against prototype OTP: 1899
    if (userOTP === '1899') {
        errorMsg.style.display = 'none';
        
        // Post request to Flask backend
        fetch('/link_bank_account', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: document.getElementById('phone').value, otp: userOTP })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                window.location.href = data.redirect_url;
            }
        });
    } else {
        errorMsg.style.display = 'block';
    }
}
</script>

</body>
</html>
