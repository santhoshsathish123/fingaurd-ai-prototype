<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FinGuard AI</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --card-bg: rgba(23, 25, 35, 0.75);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Responsive Glowing Mesh Background */
        body {
            min-height: 100vh;
            color: var(--text-main);
            padding-bottom: 40px;
            background-color: #0b0f19;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.15) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(59, 130, 246, 0.2) 0px, transparent 50%);
            background-attachment: fixed;
            background-size: cover;
        }

        /* Navigation Bar */
        nav {
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav .brand {
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        nav .nav-links {
            display: flex;
            gap: 12px;
            align-items: center;
            overflow-x: auto;
            white-space: nowrap;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            padding: 6px 10px;
            border-radius: 8px;
        }

        nav a:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.2) !important;
            color: #fca5a5 !important;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        /* Container keeping exact layout */
        .container {
            max-width: 1100px;
            margin: 24px auto 0;
            padding: 0 16px;
        }

        /* Frosted Glass Cards Across All Pages */
        .card, 
        div[style*="background: #ffffff"], 
        div[style*="background:#ffffff"],
        div[style*="background: white"] {
            background: var(--card-bg) !important;
            backdrop-filter: blur(14px) !important;
            -webkit-backdrop-filter: blur(14px) !important;
            border: 1px solid var(--card-border) !important;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37) !important;
            color: var(--text-main) !important;
            border-radius: 16px !important;
        }

        /* Preserve text contrast inside cards */
        h1, h2, h3, h4, p, label, span, td, th {
            color: var(--text-main);
        }

        input, select {
            background: rgba(15, 23, 42, 0.7) !important;
            border: 1px solid var(--card-border) !important;
            color: #ffffff !important;
            border-radius: 8px !important;
        }

        input::placeholder {
            color: #64748b !important;
        }
    </style>
</head>
<body>

    {% if session.get('user_id') %}
    <nav>
        <div class="brand">FinGuard AI</div>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('categorization') }}">Categorization</a>
            <a href="{{ url_for('subscriptions') }}">Subscriptions</a>
            <a href="{{ url_for('add_account') }}">Add Account</a>
            <a href="{{ url_for('logout') }}" class="btn-logout">Logout</a>
        </div>
    </nav>
    {% endif %}

    <div class="container">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
