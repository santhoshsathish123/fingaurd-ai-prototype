{% extends "base.html" %}
{% block content %}
<!-- Load Plaid Link Script -->
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>

<div style="max-width: 480px; margin: 30px auto; padding: 24px; background: #ffffff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);">
    <h2 style="font-size: 1.4rem; font-weight: 800; color: #1a233a; margin-bottom: 6px;">Link a Bank Account</h2>
    <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 24px;">Connect securely using Plaid or enter your account manually.</p>

    <!-- AUTOMATIC BANK SYNC BUTTON -->
    <div style="margin-bottom: 24px;">
        <button id="plaid-link-btn" style="width: 100%; padding: 14px; background: #10b981; color: #ffffff; border: none; border-radius: 10px; font-weight: 700; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 2px 8px rgba(16, 185, 129, 0.25);">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            Connect Real Bank (Plaid)
        </button>
    </div>

    <!-- SEPARATOR -->
    <div style="display: flex; align-items: center; margin-bottom: 24px;">
        <div style="flex: 1; height: 1px; background: #e2e8f0;"></div>
        <span style="padding: 0 12px; font-size: 0.75rem; color: #94a3b8; font-weight: 600; text-transform: uppercase;">OR MANUAL ENTRY</span>
        <div style="flex: 1; height: 1px; background: #e2e8f0;"></div>
    </div>

    <!-- MANUAL ACCOUNT FORM -->
    <form method="POST" action="{{ url_for('add_account') }}">
        <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Bank Name</label>
            <input type="text" name="bank_name" placeholder="e.g. Chase, Wells Fargo" required style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Account Nickname</label>
            <input type="text" name="account_nickname" placeholder="e.g. Primary Checking" required style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Account Number (or Last 4)</label>
            <input type="text" name="account_number" placeholder="•••• 4321" required style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 24px;">
            <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Starting Balance ($)</label>
            <input type="number" step="0.01" name="balance" placeholder="0.00" required style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; box-sizing: border-box;">
        </div>

        <button type="submit" style="width: 100%; padding: 12px; background: #2563eb; color: #ffffff; border: none; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer;">Add Account Manually</button>
    </form>
</div>

<!-- PLAID LINK JAVASCRIPT -->
<script>
document.getElementById('plaid-link-btn').onclick = async function () {
    try {
        const response = await fetch('/create_link_token', { method: 'POST' });
        const data = await response.json();

        if (data.error) {
            alert('Plaid Setup Error: ' + data.error);
            return;
        }

        const handler = Plaid.create({
            token: data.link_token,
            onSuccess: async function (public_token, metadata) {
                const exchangeResponse = await fetch('/exchange_public_token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ public_token: public_token })
                });

                const result = await exchangeResponse.json();
                if (result.status === 'success') {
                    window.location.href = "/dashboard";
                } else {
                    alert('Failed to exchange Plaid token.');
                }
            },
            onExit: function (err, metadata) {
                if (err != null) {
                    console.error('Plaid Exit Error:', err);
                }
            }
        });

        handler.open();
    } catch (e) {
        console.error('Plaid Request Error:', e);
        alert('Could not initialize Plaid Link. Ensure your API keys are configured.');
    }
};
</script>
{% endblock %}
